<a href="{{ .RelPermalink }}" class="blog-card">

    <img src="{{ .Params.cover }}" alt="{{ .Title }}">

    <div class="blog-card-content">

        <div class="blog-card-header">
            <h3>{{ .Title }}</h3>

            <span class="card-arrow">
                ↗
            </span>
        </div>

        <p>{{ .Params.subtitle }}</p>

    </div>

</a>
