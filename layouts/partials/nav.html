<nav class="navbar">
    <ul>
        {{ range .Site.Menus.main }}
        <li>
            <a
                href="{{ .URL }}"
                class="{{ if or ($.IsMenuCurrent "main" .) (eq $.RelPermalink .URL) }}active{{ end }}"
            >
                {{ .Name }}
            </a>
        </li>
        {{ end }}
    </ul>
</nav>
