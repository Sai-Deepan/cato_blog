{{ define "main" }}

<link rel="stylesheet" href="/css/contact.css">
<section class="contact-section contact-page">

    <div class="contact-left">
        <p class="contact-eyebrow">DEEPAN SAI / LET'S CONNECT</p>
        <h1 class="contact-title">
            <span class="lets">LET'S</span>
            <span class="talk">TALK</span>
        </h1>
    </div>

    <div class="contact-right">

        <h2>CONTACT</h2>

        <form>

            <div class="input-row">
                <div class="contact-field">
                    <label for="contact-name">NAME</label>
                    <input id="contact-name" type="text" placeholder="ENTER NAME" autocomplete="name">
                </div>
                <div class="contact-field">
                    <label for="contact-email">EMAIL</label>
                    <input id="contact-email" type="email" placeholder="ENTER MAIL" autocomplete="email">
                </div>
            </div>

            <label for="contact-subject">SUBJECT</label>
            <textarea id="contact-subject" placeholder="SUBJECT"></textarea>

            <button class="submit-btn" type="submit">
                SUBMIT
                <span class="arrow" aria-hidden="true">&nearr;</span>
            </button>

        </form>

    </div>

</section>

{{ end }}
