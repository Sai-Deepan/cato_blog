{{ define "main" }}

<article class="post">

    <header class="post-header">

        <h1>{{ .Title }}</h1>

        <div class="post-meta">
            {{ .Date.Format "02 Jan 2006" }}
        </div>

    </header>

    {{ with .Params.cover }}
        <img src="{{ . }}" class="post-cover">
    {{ end }}

    <div class="post-content">
        {{ .Content }}
    </div>

</article>

{{ end }}
