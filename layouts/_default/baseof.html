<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <script defer src="/js/skills.js"></script>
    <script defer src="/js/projects.js"></script>
    <script defer src="/js/cursor.js"></script>

    <!-- About Section World Map -->
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script defer src="/js/about-map.js"></script>
    <!-- <script defer src="/js/hero-transition.js"></script> -->
    <script defer src="/js/loading-page.js"></script>

    <link rel="preload" href="/fonts/Montserrat-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/cursor.css">

    <script defer src="/js/know-more.js"></script>
</head>

<div class="pointer-cursor" id="pointerCursor">
     <span></span><span></span><span></span><span></span>
   </div>
   <div class="follow-cursor" id="followCursor"></div>

<body>

<div id="loader">

    <div class="loader-bg"></div>

    <div class="loader-logo">
        DEEPAN SAI
    </div>

</div>

    {{ partial "nav.html" . }}

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

    <div class="terminal-window" role="dialog" aria-label="Research terminal" aria-modal="false" aria-hidden="true">
        <div class="terminal-header">~:bash&gt;console <button class="terminal-close" type="button" aria-label="Close terminal">&times;</button></div>
        <div id="terminal-output" role="log" aria-label="Terminal output" aria-live="polite" aria-relevant="additions"><div class="line">Welcome to Deepan Sai's research terminal.</div><div class="line">Type help for commands. Escape closes the console.</div></div>
        <div class="terminal-input-row"><label class="prompt" for="terminal-input">visitor:~$</label><input id="terminal-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command"></div>
    </div>

    <script src="/js/terminal.js"></script>
</body>
</html>
