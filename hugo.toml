# --------------------------------------------------
# Markdown
# --------------------------------------------------

[markup]

[markup.goldmark]

[markup.goldmark.renderer]
unsafe = false

[markup.highlight]
noClasses = false

# --------------------------------------------------
# Sitemap
# --------------------------------------------------

[sitemap]
changefreq = "weekly"
priority = 0.5
filename = "sitemap.xml"

# --------------------------------------------------
# Build
# --------------------------------------------------

[build]
writeStats = true
