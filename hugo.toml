baseURL = "https://deepansai.vercel.app/"
languageCode = "en-us"
title = "Research Site"

# URL configuration
relativeURLs = false
canonifyURLs = false
enableRobotsTXT = true

# Prevent unnecessary generated files
disableKinds = ["taxonomy", "term"]

[params]
author = "Deepan Sai"

