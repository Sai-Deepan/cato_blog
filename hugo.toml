# Main Navigation
# --------------------------------------------------

[menu]

[[menu.main]]
name = "Home"
url = "/"
weight = 10

[[menu.main]]
name = "About"
url = "/about/"
weight = 20

[[menu.main]]
name = "Experience"
url = "/experience/"
weight = 25

[[menu.main]]
name = "Blog"
url = "/blog/"
weight = 30

[[menu.main]]
name = "Articles"
url = "/articles/"
weight = 40

[[menu.main]]
name = "Research"
url = "/research/"
weight = 50

[[menu.main]]
name = "Exploits"
url = "/exploits/"
weight = 60

[[menu.main]]
